name: Build Cazi Privacy Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: cazi-privacy-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-frontend
        with:
          repository: https://github.com/cazi-cc/komari-web
          ref: radix
          artifact-name: komari-frontend

  build-binary:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-frontend
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: ./.github/actions/setup-zig
      - name: Test backend
        run: go test ./...
      - name: Build static Linux AMD64 binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          CC: zig cc -target x86_64-linux-musl
          GIN_MODE: release
        run: |
          LDFLAGS="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=cazi-privacy -X github.com/komari-monitor/komari/utils.VersionHash=${GITHUB_SHA}"
          go build -trimpath -ldflags="${LDFLAGS}" -o komari-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: komari-linux-amd64
          path: komari-linux-amd64

  publish-image:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: komari-linux-amd64
          path: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=privacy
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
